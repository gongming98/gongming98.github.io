<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八卦九宫图</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f5;padding:16px}
h2{text-align:center;margin-bottom:20px;color:#333}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:900px;margin:0 auto}
.item{background:#fff;padding:8px;border-radius:8px}
img{width:100%;height:auto;display:block}
.desc{text-align:center;margin-top:6px;font-size:14px;color:#444}
</style>
</head>
<body>
<h2>八卦图</h2>
<div class="grid">
<div class="item"><img src="images/1.jpg"><div class="desc">图1</div></div>
<div class="item"><img src="images/2.jpg"><div class="desc">图2</div></div>
<div class="item"><img src="images/3.jpg"><div class="desc">图3</div></div>
<div class="item"><img src="images/4.jpg"><div class="desc">图4</div></div>
<div class="item"><img src="images/5.jpg"><div class="desc">图5</div></div>
<div class="item"><img src="images/6.jpg"><div class="desc">图6</div></div>
<div class="item"><img src="images/7.jpg"><div class="desc">图7</div></div>
<div class="item"><img src="images/8.jpg"><div class="desc">图8</div></div>
<div class="item"><img src="images/9.jpg"><div class="desc">图9</div></div>
</div>
</body>
</html>
